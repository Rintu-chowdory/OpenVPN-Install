# Example OpenVPN server configuration (generated by openvpn-install.sh)
# This is a reference copy — the installer writes the real file to /etc/openvpn/server.conf

port 1194
proto udp
dev tun

# Certificates and keys (generated by Easy-RSA during install)
ca ca.crt
cert server.crt
key server.key
dh none
ecdh-curve prime256v1
tls-crypt tls-crypt.key

# TLS settings
tls-version-min 1.2
tls-cipher TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256
ciphersuites TLS_AES_128_GCM_SHA256
auth SHA256

# Data channel
cipher AES-128-GCM
ncp-ciphers AES-128-GCM

# Network
server 10.8.0.0 255.255.255.0
server-ipv6 fd42:42:42:42::/112
push "redirect-gateway def1"
push "dhcp-option DNS 1.1.1.1"

# Misc
keepalive 10 120
persist-key
persist-tun
crl-verify crl.pem
status /var/log/openvpn/status.log
verb 3
