# Example OpenVPN client configuration template (generated by openvpn-install.sh)
# The installer writes real client files to ~/clients/<name>.ovpn

client
proto udp
# The endpoint is the server's public IP or hostname, set during install
remote <server-endpoint> 1194
dev tun
resolv-retry infinite
nobind

# Connection security
tls-version-min 1.2
verify-client-cert none
auth-user-pass optional
remote-cert-tls server
tls-crypt tls-crypt.key

# Data channel
cipher AES-128-GCM
auth SHA256
data-ciphers AES-128-GCM

# Inline credentials (pasted by the installer)
<ca>
</ca>
<cert>
</cert>
<key>
</key>
<tls-crypt>
</tls-crypt>

# Route all traffic through the VPN
redirect-gateway def1
dhcp-option DNS 1.1.1.1
